# ===========================================================================
# Qwen3.8-27B — single 24 GB card (RTX 3090 / 3090 Ti), full 262k context
# ---------------------------------------------------------------------------
# Model:     Qwen3.8-27B (Unsloth UD-Q4_K_XL GGUF, 16.34 GiB) + mmproj-F16 ON CPU
# Engine:    llama.cpp server-cuda-b11223 (pinned, stock — no custom patches)   |   single GPU, TP=1
# Drafter:   built-in MTP, n=2 (head embedded in the GGUF)
# KV:        q4_0 / q4_0   |   Context: 262,144 (full n_ctx_train)
#
# ⚠️ THE TWO-VARIABLE FIT — neither change alone is enough:
#   (1) --no-mmproj-offload : projector out of VRAM     (-884 MiB)
#   (2) -b 2048 -ub 256     : smaller compute workspace (~-650 MiB)
#   With (1) alone the boot OOMs by 324 MiB in the MTP draft context's
#   workspace. Full measured boot + function record: see ../README.md
#
# Override defaults via .env or shell:
#   MODEL_DIR (./models)  GGUF_FILE  MMPROJ_FILE  CTX_SIZE (262144)
#   BATCH_SIZE (2048)  UBATCH_SIZE (256)  KV_TYPE (q4_0)  NP (1)
#   SERVED_NAME (qwen3.8-27b-q4kxl)  PORT (8091)  SPEC_N (2; 0 = drafter off)
#   CUDA_VISIBLE_DEVICES (0)
#   ⚠️ Raising BATCH/UBATCH toward 4096/512 re-creates the OOM. If you need
#      prefill speed, drop CTX_SIZE first (131072 frees ~2.2 GiB of KV).
#
# Quick start: ./scripts/start.sh
# ===========================================================================
services:
  llama-cpp-qwen38-27b-single-q4kxl:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11223
    container_name: llama-cpp-qwen38-27b-single-q4kxl
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PORT:-8091}:8080"
    volumes:
      - "${MODEL_DIR:-./models}:/models:ro"
    environment:
      - SPEC_N=${SPEC_N:-2}
      - SPEC=${SPEC:-}
      # default chat-template kwargs for the server
      - LLAMA_ARG_CHAT_TEMPLATE_KWARGS=${LLAMA_ARG_CHAT_TEMPLATE_KWARGS:-{"reasoning_effort":"low"}}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    # ⚠ -np 1 is intentional: extra slots each take their own KV slice and the
    #   full 262K pool leaves no room.
    # ⚠️ BUILT-IN MTP — head EMBEDDED in this GGUF (blk.64.nextn.*).
    # ⚠️ --no-mmproj-offload and -b 2048 / -ub 256 are FIT REQUIREMENTS
    #   (see the two-variable fit note above).
    # ⚠️ Sampler ships the card's thinking-mode row
    #   (temp 1.0 / top_p 0.95 / top_k 20 / min_p 0.0); override via env.
    entrypoint:
      - /bin/bash
      - -c
      - |
        _spec_n="$${SPEC_N:-2}"
        case "$${SPEC:-}" in off|OFF|Off|false|no|0) _spec_n=0 ;; esac
        case "$$_spec_n" in ""|*[!0-9]*)
          echo "[spec] SPEC_N='$$_spec_n' is not a non-negative integer." >&2
          echo "[spec] Fix: SPEC_N=<n> sets depth; SPEC_N=0 (or SPEC=off) disables." >&2
          exit 1 ;;
        esac
        if [ "$$_spec_n" -gt 0 ]; then
          echo "[spec] drafter ON (SPEC_N=$$_spec_n)" >&2
          exec /app/llama-server "$$@"
        fi
        ARGS=(); _skip=0
        for _a in "$$@"; do
          if [ "$$_skip" = 1 ]; then _skip=0; continue; fi
          case "$$_a" in
            --spec-type|--spec-draft-model|--spec-draft-n-max|--spec-draft-n-min|-md|--model-draft) _skip=1; continue ;;
          esac
          ARGS+=("$$_a")
        done
        echo "[spec] drafter OFF (SPEC_N=0 / SPEC=off) - drafter flags removed" >&2
        exec /app/llama-server "$${ARGS[@]}"
      - --
    command: >-
      --host 0.0.0.0
      --port 8080
      -m /models/${GGUF_FILE:-Qwen3.8-27B-UD-Q4_K_XL.gguf}
      --mmproj /models/${MMPROJ_FILE:-mmproj-F16.gguf}
      --no-mmproj-offload
      --alias ${SERVED_NAME:-qwen3.8-27b-q4kxl}
      -c ${CTX_SIZE:-262144}
      -b ${BATCH_SIZE:-2048}
      -ub ${UBATCH_SIZE:-256}
      -ngl 99
      -fa on
      --cache-type-k ${KV_TYPE:-q4_0}
      --cache-type-v ${KV_TYPE:-q4_0}
      -np ${NP:-1}
      --spec-type draft-mtp
      --spec-draft-n-max ${SPEC_N:-2}
      --jinja
      --reasoning ${REASONING:-on}
      --reasoning-format ${REASONING_FORMAT:-deepseek}
      --temp ${TEMP:-1.0}
      --top-p ${TOP_P:-0.95}
      --top-k ${TOP_K:-20}
      --min-p ${MIN_P:-0.0}
      --presence-penalty ${PRESENCE_PENALTY:-0.0}
      --repeat-penalty ${REPEAT_PENALTY:-1.0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
